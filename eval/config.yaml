# Smart Parking Re-optimization System (SLIIT J26-IT-335)
# Reproducibility Evaluation Harness Configuration
# Every parameter is empirically or theoretically justified below.

# Target facility architecture
facility:
  lot_id: "lot-colombo-01" # Primary commercial hub testbed in Colombo Central
  total_slots: 72 # Baseline SLIIT / Colombo commercial parking lot capacity
  layout:
    # Walking distances modeled from actual multi-bay entrance geometry (20m to 240m)
    row_distances_meters:
      row_A: [20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75]
      row_B: [70, 75, 80, 85, 90, 95, 100, 105, 110, 115, 120, 125]
      row_C: [120, 125, 130, 135, 140, 145, 150, 155, 160, 165, 170, 175]
      row_D: [170, 175, 180, 185, 190, 195, 200, 205, 210, 215, 220, 225]
      row_E: [200, 205, 210, 215, 220, 225, 230, 235, 238, 240, 245, 250]
      row_F: [210, 215, 220, 225, 230, 235, 240, 242, 245, 248, 250, 250]
    # Vehicle size distribution (60% small, 30% medium, 10% large matching Colombo vehicle mix)
    slot_sizes:
      small: 42
      medium: 22
      large: 8
    covered_slots_count: 24 # First two rows covered from weather

# Simulation timeline and statistical rigor
simulation:
  duration_hours: 24 # Full diurnal cycle (midnight to midnight)
  seeds_count: 30 # Central Limit Theorem threshold (N=30) for valid 95% Confidence Intervals
  base_seed: 20261019
  time_step_seconds: 10 # 10s discrete time granularity for sub-minute arrivals

# Traffic demand profile
demand:
  baseline_drivers_per_hour: 60 # Moderate commercial parking load (60 arrivals/hr)
  demand_sweep: [30, 50, 75, 100] # Sweeps off-peak (30) to heavy saturation (100)
  # Diurnal arrival multipliers across 24 hours (morning peak 08-10, evening peak 16-18)
  hourly_profile: [
    0.15, 0.10, 0.08, 0.05, 0.08, 0.20, # 00:00 - 05:59 (Overnight lull)
    0.55, 0.90, 1.45, 1.35, 1.10, 0.95, # 06:00 - 11:59 (Morning ingress peak)
    1.05, 1.15, 0.90, 0.85, 1.40, 1.50, # 12:00 - 17:59 (Lunch & evening rush)
    1.20, 0.95, 0.70, 0.50, 0.35, 0.20  # 18:00 - 23:59 (Night egress)
  ]

# Stochastic driver behavior & uncertainty
stochastic_driver:
  no_show_rate_default: 0.12 # 12% baseline no-show rate in urban parking reservations
  no_show_sweep: [0.05, 0.10, 0.15, 0.20] # Sensitivity: 5% (high commitment) to 20% (lax)
  mean_delay_minutes_default: 3.5 # Mean traffic delay on Colombo road network
  delay_std_minutes: 4.0 # Gaussian delay dispersion
  delay_sweep: [0.0, 3.0, 5.0, 10.0] # Sensitivity: 0m (ideal) to 10m (gridlock)
  parking_duration_hours_mean: 2.2 # Average parking dwell time (Gaussian mu=2.2h, sigma=1.0h, min=0.5h)
  parking_duration_hours_std: 1.0

# Mathematical model policies
policies:
  hold_duration_minutes: 15.0 # Guaranteed grace period window (SYS-02)
  in_transit_trigger_eta_minutes: 10.0 # Re-optimization threshold window (SYS-03)
  min_walking_saved_meters: 50.0 # Minimum walking distance reduction threshold (SYS-03)
  min_score_improvement_points: 20.0 # Minimum algorithm score improvement threshold (SYS-03)

# Upgrade acceptance probability model
# NOTE: Model assumption — not an empirical finding!
acceptance_model:
  type: "logistic" # Logistic choice model: p(accept | delta_d) = 1 / (1 + exp(-k * (delta_d - d0)))
  k: 0.04 # Sensitivity curve steepness (at +50m saved, p ~= 73%; at +100m saved, p ~= 95%)
  d0: 25.0 # Inflection distance (half probability at 25m saved)
  fixed_sweep: [0.30, 0.50, 0.70, 0.90] # Sensitivity sweep testing exogenous fixed compliance levels
