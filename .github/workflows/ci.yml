name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ "main", "Anuk/V1.1", "phase5-eval-release" ]
  pull_request:
    branches: [ "main", "Anuk/V1.1", "phase5-eval-release" ]

jobs:
  flutter-quality:
    name: Flutter Analyze & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --fatal-infos

      - name: Execute Flutter Unit & Widget Tests
        run: flutter test --coverage

  firebase-functions-and-rules:
    name: Firebase Functions, Security Rules & Latency Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 17 (Required for Firebase Local Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm --prefix functions ci

      - name: Install Firebase Tools CLI
        run: npm install -g firebase-tools

      - name: Compile TypeScript Cloud Functions
        run: npm --prefix functions run build

      - name: Execute Security Rules & Subsystem Integration Tests (with Emulator)
        run: |
          firebase emulators:exec --only firestore "npm --prefix functions test"

  eval-parity-and-system-check:
    name: Algorithmic Scoring Parity & System Replay Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Functions Dependencies & Build TS
        run: |
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Verify Mathematical Parity Against Shared Test Vectors
        run: python -m eval.test_scoring_parity

      - name: Run 200-Trip System Replay Parity Check (Tolerance <= 5%)
        run: python -m eval.run_system_check
